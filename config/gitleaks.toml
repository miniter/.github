title = "Miniter Gitleaks config — secrets + PII"

[extend]
useDefault = true

[[rules]]
id = "us-ssn"
description = "US Social Security Number"
# Expanded alternations, not lookaheads: gitleaks compiles rules with RE2,
# which rejects (?!...) and panics on config load. Excludes area 000/666/9xx,
# group 00, serial 0000 — the reserved ranges no real SSN uses.
regex = '''\b(?:0(?:0[1-9]|[1-9][0-9])|[1-578][0-9]{2}|6(?:[0-57-9][0-9]|6[0-57-9]))-(?:0[1-9]|[1-9][0-9])-(?:[0-9]{3}[1-9]|[0-9]{2}[1-9][0-9]|[0-9][1-9][0-9]{2}|[1-9][0-9]{3})\b'''
tags = ["pii", "ssn"]

[[rules]]
id = "us-itin"
description = "US Individual Taxpayer Identification Number"
regex = '''\b9\d{2}-[7-9]\d-\d{4}\b'''
tags = ["pii", "itin"]
