title = "Miniter Gitleaks config — secrets + PII"

[extend]
useDefault = true

[[rules]]
id = "us-ssn"
description = "US Social Security Number"
# Expanded alternations, not lookaheads: gitleaks compiles rules with RE2,
# which rejects (?!...) and panics on config load. Excludes area 000/666/9xx,
# group 00, serial 0000 — the reserved ranges no real SSN uses.
regex = '''\b(?:0(?:0[1-9]|[1-9][0-9])|[1-578][0-9]{2}|6(?:[0-57-9][0-9]|6[0-57-9]))-(?:0[1-9]|[1-9][0-9])-(?:[0-9]{3}[1-9]|[0-9]{2}[1-9][0-9]|[0-9][1-9][0-9]{2}|[1-9][0-9]{3})\b'''
tags = ["pii", "ssn"]

[[rules]]
id = "us-itin"
description = "US Individual Taxpayer Identification Number"
regex = '''\b9\d{2}-[7-9]\d-\d{4}\b'''
tags = ["pii", "itin"]

# Microsoft publishes these two account keys verbatim; both authenticate only
# against a local emulator and grant access to nothing. They were the single
# reason behind most per-repo .gitleaksignore entries, so matching them here
# beats re-acknowledging them in every repo.
#
# Match the literal VALUES and nothing else. The audit corpus holds 10 distinct
# AccountKey literals and only these 2 are published — the other 8 are real
# storage/Cosmos keys, two of them live. Any account-name, entropy, or
# "looks like an emulator key" match would suppress those. The `+` characters
# are escaped because these are regexes, not literals.
[allowlist]
description = "Published Microsoft emulator account keys (Azurite, Cosmos DB emulator)"
regexTarget = "match"
regexes = [
  '''Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==''',
  '''C2y6yDjf5/R\+ob0N8A7Cgv30VRDJIWEHLM\+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==''',
]
