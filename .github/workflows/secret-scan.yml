name: Secret & PII Scan

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 10
      runs-on:
        description: "Runner label"
        required: false
        type: string
        default: "ubuntu-latest"
      trufflehog-version:
        description: "TruffleHog scanner image tag (without leading v)"
        required: false
        type: string
        default: "3.97.4"
      gitleaks-version:
        description: "Gitleaks CLI version (without leading v)"
        required: false
        type: string
        default: "8.30.1"

permissions: {}

jobs:
  scan:
    if: github.event_name == 'pull_request'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout PR head (shallow)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # A plain shallow checkout makes both scanners pass silently: base.sha is missing, so
      # gitleaks errors on the range and TruffleHog cannot resolve its merge base, and each
      # reports zero bytes scanned. Deepen until the merge base and every commit in the range
      # have their parents (a range commit on the shallow boundary is diffed as a root, i.e.
      # the whole tree; TruffleHog's own merge-base walk reads the merge base's parents), then
      # hand both scanners merge-base..head -- the same range TruffleHog derives itself from
      # base..head on a full clone.
      - name: Fetch history back to the merge base
        id: merge-base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          git fetch --no-tags --quiet --depth="$((PR_COMMITS + 1))" origin "$HEAD_SHA"
          git fetch --no-tags --quiet --depth=1 origin "$BASE_SHA"
          merge_base=""
          for _ in $(seq 1 20); do
            if merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null) &&
               ! grep -qxFf .git/shallow <(echo "$merge_base"; git rev-list "$merge_base..$HEAD_SHA"); then
              break
            fi
            merge_base=""
            git fetch --no-tags --quiet --deepen=100 origin "$BASE_SHA" "$HEAD_SHA"
          done
          if [ -z "$merge_base" ]; then
            git fetch --no-tags --quiet --unshallow origin
            merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          fi
          echo "sha=$merge_base" >> "$GITHUB_OUTPUT"

      - name: Fetch shared Gitleaks config from miniter/.github
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: miniter/.github
          # Pinned to the same tag callers pin the workflow to, so the rule pack
          # can never drift ahead of the workflow that reads it.
          ref: v1
          path: .miniter-shared
          sparse-checkout: config/gitleaks.toml
          sparse-checkout-cone-mode: false

      - name: TruffleHog (verified secrets, diff)
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          base: ${{ steps.merge-base.outputs.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          # The action always appends --fail itself; repeating it here aborts
          # the scanner before it runs. Pin the image tag too — the action SHA
          # pins the wrapper, not the scanner it pulls.
          version: ${{ inputs.trufflehog-version }}
          # A scan error (an unresolvable range, say) otherwise exits 0 with zero bytes scanned.
          extra_args: --only-verified --fail-on-scan-errors

      - name: Install Gitleaks (with checksum verification)
        env:
          VERSION: ${{ inputs.gitleaks-version }}
        run: |
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          TARBALL="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSLf -o "$TARBALL" "${BASE}/${TARBALL}"
          curl -sSLf -o checksums.txt "${BASE}/gitleaks_${VERSION}_checksums.txt"
          grep " ${TARBALL}$" checksums.txt | sha256sum -c -
          tar -xzf "$TARBALL" gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Gitleaks (PII + secondary secrets, diff)
        id: gitleaks
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.merge-base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks git \
            --config=.miniter-shared/config/gitleaks.toml \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --report-format=sarif \
            --report-path=gitleaks.sarif \
            --redact \
            --exit-code=1

      - name: Summarize Gitleaks findings
        if: always() && steps.gitleaks.outcome == 'failure'
        run: |
          {
            echo "### Gitleaks findings"
            jq -r '.runs[].results[] | "- **\(.ruleId)** \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' gitleaks.sarif
            echo
            echo "<details><summary>If a finding is a false positive</summary>"
            echo
            echo "Put \`gitleaks:allow\` in a comment on the offending line. It travels with the line, so it survives a rebase or squash — prefer it wherever the file format has comments."
            echo
            echo "For JSON, CSV and other comment-less formats, add the fingerprint to \`.gitleaksignore\` in the repo root:"
            echo
            echo '```'
            jq -r '.runs[].results[] | "\(.partialFingerprints.commitSha):\(.locations[0].physicalLocation.artifactLocation.uri):\(.ruleId):\(.locations[0].physicalLocation.region.startLine)"' gitleaks.sarif
            echo '```'
            echo
            echo "A fingerprint is scoped to its commit SHA and line number, so **add it after any squash or rebase, as the last commit** — rewriting history invalidates it and the gate goes red again."
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Gitleaks SARIF
        if: always() && steps.gitleaks.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          retention-days: 7

      - name: Fail on Gitleaks findings
        if: always() && steps.gitleaks.outcome == 'failure'
        run: exit 1
