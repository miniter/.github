name: Secret & PII Scan

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 10
      runs-on:
        description: "Runner label"
        required: false
        type: string
        default: "ubuntu-latest"
      gitleaks-version:
        description: "Gitleaks CLI version (without leading v)"
        required: false
        type: string
        default: "8.30.1"

permissions: {}

jobs:
  scan:
    if: github.event_name == 'pull_request'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout PR (full history for diff base)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Fetch shared Gitleaks config from miniter/.github
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: miniter/.github
          ref: main
          path: .miniter-shared
          sparse-checkout: config/gitleaks.toml
          sparse-checkout-cone-mode: false

      - name: TruffleHog (verified secrets, diff)
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified --fail

      - name: Install Gitleaks (with checksum verification)
        env:
          VERSION: ${{ inputs.gitleaks-version }}
        run: |
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          TARBALL="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSLf -o "$TARBALL" "${BASE}/${TARBALL}"
          curl -sSLf -o checksums.txt "${BASE}/gitleaks_${VERSION}_checksums.txt"
          grep " ${TARBALL}$" checksums.txt | sha256sum -c -
          tar -xzf "$TARBALL" gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Gitleaks (PII + secondary secrets, diff)
        id: gitleaks
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks git \
            --config=.miniter-shared/config/gitleaks.toml \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --report-format=sarif \
            --report-path=gitleaks.sarif \
            --redact \
            --exit-code=1

      - name: Summarize Gitleaks findings
        if: always() && steps.gitleaks.outcome == 'failure'
        run: |
          echo "### Gitleaks findings" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.runs[].results[] | "- **\(.ruleId)** \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' gitleaks.sarif >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Gitleaks SARIF
        if: always() && steps.gitleaks.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          retention-days: 7

      - name: Fail on Gitleaks findings
        if: always() && steps.gitleaks.outcome == 'failure'
        run: exit 1
