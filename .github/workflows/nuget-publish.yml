name: NuGet Publish
on:
  workflow_call:
    inputs:
      product-version:
        description: "Package base version (e.g., 6.2)"
        required: true
        type: string
      working-directory:
        description: "Directory containing the project to pack"
        required: false
        type: string
        default: "."
      project-file:
        description: "Specific .csproj file to pack (empty for default)"
        required: false
        type: string
        default: ""
      run-tests:
        description: "Run dotnet test before pack"
        required: false
        type: boolean
        default: false
      test-working-directory:
        description: "Directory for test execution (only used when run-tests is true)"
        required: false
        type: string
        default: "."
      test-filter:
        description: "dotnet test --filter expression (e.g., TestCategory!=RequireSql)"
        required: false
        type: string
        default: ""
      add-nuget-source:
        description: "Add private GitHub Packages NuGet source"
        required: false
        type: boolean
        default: true
      base-number-subtraction:
        description: "Base number for run number subtraction in version calc"
        required: false
        type: string
        default: ""
      dotnet-version:
        description: ".NET SDK version (empty for default)"
        required: false
        type: string
        default: ""
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 15
      globalization-invariant:
        description: "Set DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=true (disable for culture-dependent tests)"
        required: false
        type: boolean
        default: true
      package-validation:
        description: "Fail before publishing when a package removes or changes a public member of its last published release (ApiCompat). Packages compiled against that release would throw MissingMethodException at run time."
        required: false
        type: boolean
        default: false
    secrets:
      NUGET_REPOSITORY_READONLY_GITHUB:
        description: "PAT with read:packages for the miniter GitHub Packages feed (used when add-nuget-source is true). Declared so callers can pass an explicit secrets list instead of secrets: inherit."
        required: false

permissions: {}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: ${{ inputs.globalization-invariant }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      checks: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Calculate version
        id: version
        uses: waynebrantley/github-branchversion@4edb9292e8b4ac508b0b0bffc29a84f8a2a0fd1a # v1
        with:
          base-version: ${{ inputs.product-version }}
          base-number-for-subtraction-from-run-number: ${{ inputs.base-number-subtraction }}

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Add Github Nuget Source
        if: inputs.add-nuget-source
        env:
          NUGET_PAT: ${{ secrets.NUGET_REPOSITORY_READONLY_GITHUB }}
          NUGET_USERNAME: ${{ vars.NUGET_USERNAME }}
          NUGET_SOURCE_URL: ${{ vars.NUGET_SOURCE_URL }}
        # Registered in the runner's user-level config as "miniter". A repo nuget.config that maps packages to the
        # "miniter" source clears this source but still picks up these credentials by name; a repo without one
        # restores from it as before. The repo's own config file is never written to.
        run: |
          dotnet nuget list source > /dev/null
          dotnet nuget add source --username "$NUGET_USERNAME" --password "$NUGET_PAT" --store-password-in-clear-text --name miniter --configfile "$HOME/.nuget/NuGet/NuGet.Config" "$NUGET_SOURCE_URL"

      - name: Run Tests
        if: inputs.run-tests
        working-directory: ${{ inputs.test-working-directory }}
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: dotnet test --configuration Release ${{ inputs.test-filter && format('--filter "{0}"', inputs.test-filter) || '' }}

      - name: Build and Pack
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          PROJECT_FILE: ${{ inputs.project-file }}
        run: dotnet pack $PROJECT_FILE --configuration Release --output "$GITHUB_WORKSPACE/Artifacts" /p:Version="$PACKAGE_VERSION" /p:ContinuousIntegrationBuild=true

      # A change that compiles for every caller can still break the ones already compiled: changing only a return type does,
      # and a package built against the old signature then throws MissingMethodException at run time. Each package is compared
      # with the highest release on the feed, so a break fails here instead of in a consumer. An intentional break is declared
      # in CompatibilitySuppressions.xml beside the project; the error says how to generate it.
      - name: Validate against the last release
        if: inputs.package-validation
        working-directory: ${{ inputs.working-directory }}
        env:
          NUGET_PAT: ${{ secrets.NUGET_REPOSITORY_READONLY_GITHUB }}
          NUGET_USERNAME: ${{ vars.NUGET_USERNAME }}
          NUGET_SOURCE_URL: ${{ vars.NUGET_SOURCE_URL }}
          PROJECT_FILE: ${{ inputs.project-file }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/apicompat"
          dotnet tool install Microsoft.DotNet.ApiCompat.Tool --version 10.0.403 --tool-path "$tools" > /dev/null
          # The credentials go to curl on stdin, so they are never on a command line.
          feed() { printf 'user = "%s:%s"\n' "$NUGET_USERNAME" "$NUGET_PAT" | curl -sS -K - "$@"; }
          base=$(feed -f "$NUGET_SOURCE_URL" | jq -r '[.resources[] | select(."@type" | startswith("PackageBaseAddress"))][0]."@id" | rtrimstr("/")')
          suppressions="$(dirname "${PROJECT_FILE:-.}")/CompatibilitySuppressions.xml"
          failed=0
          for package in "$GITHUB_WORKSPACE/Artifacts"/*.nupkg; do
            [[ "$package" == *.symbols.nupkg ]] && continue
            id=$(unzip -p "$package" '*.nuspec' | grep -oPm1 '(?<=<id>)[^<]+')
            lower="${id,,}"
            status=$(feed -o "$RUNNER_TEMP/$lower.index.json" -w '%{http_code}' "$base/$lower/index.json")
            # A package that has never been released has nothing to compare with; GitHub Packages answers 404 for it. Any other
            # failure stops the publish rather than skipping the check.
            if [ "$status" = 404 ]; then
              echo "::notice::$id has no release on the feed to compare with."
              continue
            fi
            [ "$status" = 200 ] || { echo "::error::Listing the releases of $id answered HTTP $status."; exit 1; }
            release=$(jq -r '[.versions[] | select(contains("-") | not)] | sort_by(split(".") | map(tonumber)) | last // empty' "$RUNNER_TEMP/$lower.index.json")
            if [ -z "$release" ]; then
              echo "::notice::$id has only prereleases on the feed, so there is no release to compare with."
              continue
            fi
            # The download redirects to storage; curl does not send the credentials on to the other host.
            feed -fL -o "$RUNNER_TEMP/$lower.$release.nupkg" "$base/$lower/$release/$lower.$release.nupkg"
            echo "Comparing $(basename "$package") with release $release"
            args=(package "$package" --baseline-package "$RUNNER_TEMP/$lower.$release.nupkg" --permit-unnecessary-suppressions)
            [ -f "$suppressions" ] && args+=(--suppression-file "$suppressions")
            if ! "$tools/apicompat" "${args[@]}"; then
              echo "::error::$id failed validation against $release; the output above says why. A CP error is a change that breaks callers compiled against $release: restore the member, or declare the break with dotnet tool install -g Microsoft.DotNet.ApiCompat.Tool && apicompat package <new.nupkg> --baseline-package <$release.nupkg> --generate-suppression-file --suppression-output-file $suppressions"
              failed=1
            fi
          done
          exit $failed

      - name: Cleanup NuGet credentials
        if: always()
        run: dotnet nuget remove source miniter --configfile "$HOME/.nuget/NuGet/NuGet.Config" || true

      - name: Publish the package to GPR
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_SOURCE_URL: ${{ vars.NUGET_SOURCE_URL }}
        run: dotnet nuget push "$GITHUB_WORKSPACE/Artifacts"/*.nupkg -k "$NUGET_AUTH_TOKEN" -s "$NUGET_SOURCE_URL" --skip-duplicate
